# MARLA diagnostic scenario (evidence-aware action selection, Scenario B2):
# multiple visible hosts with different, randomized vulnerabilities.
#
# Two DMZ hosts, both reachable from the internet from the first step, each
# sensitive with probability 0.5 (MARLA regenerates realizations without
# any target, so 1-2 targets per episode). A host's sensitivity is only
# observed once it has been exploited. Every host independently draws its OS
# (linux/windows) and services, so the exploit that works differs between
# the two hosts and between episodes: a failed e_drupal on one host says
# nothing about the other. Five exploits for two OS families make a service
# scan cheaper on average than blind attempts (2.0 vs ~2.6 actions to a
# foothold). Same exploit/privesc set as evidence_b_pivot_one_target.v2.yaml,
# without its internal pivot subnet (whose target the untrained policy
# reached too rarely for PPO to learn anything but an immediate FINISH).
# Every realization is rootable; nothing requires a scan before an exploit.
# This is special scenario format, that leaves some variables to chance. Not compatible with the original nasim generator/loader.

subnets: [2] # DMZ: 2 hosts
address_space_bounds: (5, 10)
topology: [[ 1, 1],
           [ 1, 1]]
subnet_labels:
  1: DMZ
sensitive_hosts:
  1: 0.5
os:
  - linux
  - windows
services:
  - 21_linux_proftpd
  - 80_linux_drupal
  - 80_linux_phpwiki
  - 9200_windows_elasticsearch
  - 80_windows_wp_ninja
  - 3306_any_mysql
sensitive_services:
  - 3306_any_mysql
processes:
  - ~
exploits:
  e_proftpd:
    service: 21_linux_proftpd
    os: linux
    prob: 1.0
    cost: 1
    access: user
  e_drupal:
    service: 80_linux_drupal
    os: linux
    prob: 1.0
    cost: 1
    access: user
  e_phpwiki:
    service: 80_linux_phpwiki
    os: linux
    prob: 1.0
    cost: 1
    access: user
  e_elasticsearch:
    service: 9200_windows_elasticsearch
    os: windows
    prob: 1.0
    cost: 1
    access: root
  e_wp_ninja:
    service: 80_windows_wp_ninja
    os: windows
    prob: 1.0
    cost: 1
    access: user
privilege_escalation:
  pe_kernel:
    process: ~
    os: linux
    prob: 1.0
    cost: 1
    access: root
  pe_windows:
    process: ~
    os: windows
    prob: 1.0
    cost: 1
    access: root
service_scan_cost: 1
os_scan_cost: 1
subnet_scan_cost: 1
process_scan_cost: 1
host_configurations: _random
firewall: _subnets
