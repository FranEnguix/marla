[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name only -- the importable package stays `marla`
# (see src/marla, [tool.hatch.build.targets.wheel] below, and the `marla`
# console script), so `import marla` / `marla run ...` are unaffected by
# this. Named "marla-agents" rather than "marla" because Warehouse's
# anti-typosquatting check blocks new names within edit-distance 1 of an
# existing project, and "marla" collides with the already-registered
# "marl" and "marlo".
name = "marla-agents"
version = "0.5.0"
description = "MARLA: Multi-Agent Reinforcement Learning Architecture for NASimEmu"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Fran Enguix", email = "enguix.fco@gmail.com"},
]
keywords = [
  "reinforcement-learning",
  "multi-agent",
  "offensive-security",
  "nasimemu",
  "ppo",
  "large-language-models",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "spade>=4.0",
  "numpy",
  "pandas",
  "matplotlib",
  "torch",
  "torch-geometric",
  # Process/system CPU + RAM telemetry (monitoring/resources.py). Pure
  # Python + a small C extension, cross-platform, no GPU/driver
  # dependency -- always available, unlike GPU utilization below.
  "psutil>=5.9",
]

[project.optional-dependencies]
# Real local-model Plan Maker backend (Milestone 9). Not required for the
# baseline variant, the assisted variant with a mock Plan Maker, or a
# remote-API Plan Maker backend.
local-lm = [
  "transformers>=4.40",
  "accelerate>=0.30",
]
# GPU utilization/memory telemetry via NVML (monitoring/resources.py).
# Genuinely optional: torch.cuda.* memory stats work without it on any
# CUDA build, and CPU-only machines have no use for it at all -- absence
# degrades gracefully to null utilization fields, never a training
# failure (see ResourceMonitor's own docstring).
gpu = [
  "nvidia-ml-py>=12.0",
]
# Per-agent energy/CO2eq tracking (monitoring/carbon.py). Optional: an
# ordinary training/eval run works identically without it as long as
# carbon.enabled stays false (the default) -- only the research HPO study
# configs turn this on, and CarbonTracker.start() fails loudly and
# specifically if carbon.enabled=true but this package isn't installed,
# rather than silently skipping tracking.
carbon = [
  "codecarbon>=3.3.0,<4.0",
]
# Optuna hyperparameter-study support (learning/optuna_study.py,
# `marla optimize`). Optional: MARLA's normal training/evaluation paths
# never import optuna.
optuna = [
  "optuna>=5.0.0,<6.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/FranEnguix/marla"
Repository = "https://github.com/FranEnguix/marla"
Issues = "https://github.com/FranEnguix/marla/issues"
Documentation = "https://marla.readthedocs.io"

[project.scripts]
marla = "marla.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marla"]

[tool.hatch.build.targets.sdist]
# Without this, hatchling's default sdist walks the whole repo root --
# picking up the vendored NASimEmu/ and NASimEmu-agents/ trees (including
# a stray wandb run symlink that crashes the build outright) plus
# runs/docs/_build artifacts. A PyPI sdist should only ever contain the
# marla package itself, its metadata, and the top-level docs a PyPI
# project page needs -- not the third-party research code it sits next to
# in this repository.
include = [
  "/src",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: slower integration tests",
  "distributed: requires multiple processes / a reachable XMPP server",
  "gpu: requires a CUDA-capable device",
]
