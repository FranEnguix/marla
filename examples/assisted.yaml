# MARLA experiment configuration -- ASSISTED variant.
#
# "Assisted" means consultation.mode: learned: the RL Orchestrator's
# recurrent PPO policy gains a learned *query gate* that decides, every
# environment step, whether to pause and ask a Gatekeeper-validated Plan
# Maker (a frozen, advisory language model) for confidence scores over the
# current legal actions -- then a learned *trust head* decides how much to
# actually weight that advice in the final decision. Consultation is
# on-demand: most steps are not queried at all, and the query gate is
# trained (via a per-consultation cost penalty and an entropy bonus) to
# learn when asking is actually worth it, not to follow a fixed schedule.
#
# Shares every hyperparameter that matters for a fair comparison with
# baseline.yaml (graph encoder, GRU, candidate scorer, critic, PPO
# hyperparameters, scenario, seed, step budget) -- only adds the query
# gate / trust head / advice scale / Gatekeeper / Plan Maker.
#
# Full field-by-field reference: docs/configuration.rst. This file's
# comments focus on *why* each value was chosen for this specific example.
#
# Run it:
#   pip install -e ".[local-lm]"   # once, for the local Plan Maker backend
#   export MARLA_RL_ORCHESTRATOR_PASSWORD=changeme
#   export MARLA_GATEKEEPER_PASSWORD=changeme
#   export MARLA_PLAN_MAKER_1_PASSWORD=changeme
#   marla run examples/assisted.yaml
#   marla summarize runs/ppo_plan_maker/ppo-plan-maker-seed-42
#
# Fair warning on cost: unlike the baseline variant, every queried step is
# a real language-model generation call, and each one can take tens of
# seconds on CPU. At this file's scale (10000 environment steps) that is
# still a genuinely long run if the query gate consults often -- see
# experiment_templates/assisted.yaml (generated by `marla init`) for a
# much smaller quickstart-sized version of the same shape if you just want
# to see the whole pipeline work end to end in a few minutes.

schema_version: "1.0"  # only supported value

experiment:
  name: ppo_plan_maker
  run_id: ppo-plan-maker-seed-42  # see baseline.yaml's comment on run_id
  phase: training  # training | evaluation (see baseline.yaml)
  # Same seed as baseline.yaml on purpose -- the only intended difference
  # between the two runs is the query gate/Plan Maker, not the episode
  # seed sequence.
  seed: 42

execution:
  mode: local  # local | distributed -- see baseline.yaml's comment

# Left as `auto` here (unlike experiment_templates/assisted.yaml's
# quickstart, which forces `cpu` for a first-run demo where GPU driver
# health is an unknown) -- a real research-scale run benefits enough from
# GPU inference speed for both the policy *and* the Plan Maker (see
# model.backend: local below, which resolves its own device independently)
# that it's worth requesting, with automatic CPU fallback if CUDA doesn't
# actually initialize.
device: auto

xmpp:
  server: localhost  # see baseline.yaml's comment

environment:
  mode: simulation
  # MARLA's own repaired, pre-validated copy -- see baseline.yaml's comment
  # on this exact field for why (the original NASimEmu scenario is not
  # universally solvable and would fail `marla run`'s preflight check).
  scenario: marla://sm_entry_user_three_subnets.solvable.v2.yaml
  max_episode_steps: 100

objective:
  type: capture_target  # only supported value: gain root access on every sensitive host
  # Free-text context sent to the Plan Maker alongside the observation --
  # supplementary color, not the sole source of goal information: the
  # Plan Maker's prompt already states the capture_target goal explicitly
  # and precisely (gain root access on every host the observation marks
  # is_sensitive_target, using the observation's own
  # sensitive_hosts_total/sensitive_hosts_with_root_access progress
  # counts), so this can stay short.
  description: Obtain the configured target access

policy:
  algorithm: recurrent_ppo
  graph_encoder:
    type: graphsage
    hidden_size: 128
    layers: 2
  action_encoder:
    hidden_size: 128
    action_type_embedding_size: 32
  recurrent:
    hidden_size: 128
    sequence_length: 64
  ppo:
    # Identical to baseline.yaml's ppo block, for a fair comparison.
    total_environment_steps: 10000
    steps_per_env: 512
    epochs: 4
    minibatch_sequences: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    # Entropy bonus for the *query* gate's Bernoulli distribution -- keeps
    # the gate from collapsing to always/never query too early, the same
    # way action_entropy_coefficient below does for the action
    # distribution. This one is a genuine no-op in baseline.yaml (no query
    # gate exists there); here it actually matters.
    query_entropy_coefficient: 0.01
    action_entropy_coefficient: 0.01
    max_grad_norm: 0.5
    optimizer:
      type: adam
      learning_rate: 0.0003
      eps: 1.0e-5  # see baseline.yaml's comment
      scheduler:  # see baseline.yaml's comment
        type: linear
        end_factor: 0.0

consultation:
  # learned: requires exactly one `gatekeeper:` and one `agents[]` entry
  # with role: plan_maker below (config validation enforces both).
  mode: learned
  # Subtracted from the training reward (not the reported NASimEmu/
  # benchmark reward) every time the query gate decides to consult -- this
  # is what actually gives the query gate something to weigh "is asking
  # worth it" against. 0.10 is a meaningful fraction of this scenario's
  # rewards (completion_reward defaults to 1.0), so consulting on every
  # single step is not a free lunch.
  cost: 0.10
  # How many correction attempts the Gatekeeper gives the Plan Maker (a
  # schema-invalid or wrong-action-ID-coverage response gets a
  # CORRECTION_REQUEST with the specific reason and a worked example)
  # before giving up and reporting schema_rejected. 3 was chosen after
  # observing that even a capable small model occasionally needs more than
  # one retry to produce an exact-coverage JSON mapping; 0 would mean "no
  # second chances at all."
  max_schema_revisions: 3

rl_orchestrator:
  alias: rl_orchestrator
  jid: rl-orchestrator@localhost
  password_env: MARLA_RL_ORCHESTRATOR_PASSWORD

gatekeeper:
  alias: gatekeeper
  jid: gatekeeper@localhost
  password_env: MARLA_GATEKEEPER_PASSWORD

agents:
  # Exactly one entry with role: plan_maker in this release (spec
  # non-goals: multiple simultaneous Plan Makers aren't supported yet).
  - alias: plan_maker_1
    jid: plan-maker@localhost
    password_env: MARLA_PLAN_MAKER_1_PASSWORD
    role: plan_maker  # only supported value
    model:
      # local: a real Hugging Face `transformers` model, loaded and run on
      # this machine (needs the `local-lm` extra). remote: not implemented
      # in this release -- fails loudly and immediately with an
      # explanatory error if selected, rather than silently doing nothing.
      backend: local
      # A smaller 0.5B-parameter model was tried first for a faster
      # download/first run, but in practice it doesn't reliably score
      # every one of the required action IDs in one attempt (observed:
      # 10/11 covered, then 1/11 after a correction retry) -- it reasons
      # sensibly about which actions look promising, it just doesn't
      # reliably enumerate the full required set. This model follows
      # "score every one of these N items, exactly" far more reliably.
      # ~3GB one-time download.
      name: Qwen/Qwen2.5-1.5B-Instruct
      # A *floor* on generation length, not a fixed value -- the local
      # backend also estimates a per-request minimum from the actual
      # number and length of legal action IDs and uses whichever is
      # larger, so this only matters as a safety margin for an unusually
      # small action set. 256 covers this scenario's action count (~11)
      # with real headroom without being wasteful on every call.
      max_new_tokens: 256
    # Free-text version tag, echoed back in every advisory response for
    # reproducibility bookkeeping -- bump it if you change the prompt
    # template in a way that matters for comparing runs.
    prompt_version: nasimemu-plan-maker-v1
    knowledge:
      # package://marla/<path-inside-the-installed-marla-package>, or a
      # plain filesystem path to a knowledge YAML file of your own.
      path: package://marla/knowledge/nasimemu_rules.yaml
      # Must match the loaded knowledge file's own `version:` field, or
      # the run refuses to start -- a deliberate guard against silently
      # running with a knowledge file you didn't think you were using.
      version: nasimemu-rules-v1

metrics:
  output_directory: runs
  record_decisions: true
  # Left at 0 (disabled) here, unlike baseline.yaml: a periodic evaluation
  # pass still consults the Plan Maker for its own queried steps, so
  # enabling it would multiply real language-model inference cost on top
  # of an already-expensive run. Turn it on (e.g. eval_episodes: 2,
  # eval_every_rollouts: 10) once you've budgeted for that extra cost and
  # want a genuine train-vs-eval curve for the assisted variant too.
  eval_episodes: 0
  eval_every_rollouts: 1

reproducibility:
  deterministic_torch: true
