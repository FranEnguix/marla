schema_version: "1.0"

experiment:
  name: ppo_baseline
  run_id: ppo-baseline-seed-42
  phase: training
  seed: 42

execution:
  mode: local

device: auto

xmpp:
  server: localhost

environment:
  mode: simulation
  scenario: ../NASimEmu/scenarios/sm_entry_dmz_one_subnet.v2.yaml
  max_episode_steps: 100

objective:
  type: capture_target
  description: Obtain the configured target access

policy:
  algorithm: recurrent_ppo
  graph_encoder:
    type: graphsage
    hidden_size: 128
    layers: 2
  action_encoder:
    hidden_size: 128
    action_type_embedding_size: 32
  recurrent:
    hidden_size: 128
    sequence_length: 32
  ppo:
    total_environment_steps: 100000
    rollout_steps: 512
    epochs: 4
    minibatch_sequences: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    query_entropy_coefficient: 0.01
    action_entropy_coefficient: 0.01
    max_grad_norm: 0.5
    learning_rate: 0.0003

consultation:
  mode: disabled

rl_orchestrator:
  alias: rl_orchestrator
  jid: rl-orchestrator@localhost
  password_env: MARLA_RL_ORCHESTRATOR_PASSWORD

metrics:
  output_directory: runs
  record_decisions: true

reproducibility:
  deterministic_torch: true
