# MARLA experiment configuration -- BASELINE variant.
#
# "Baseline" means consultation.mode: disabled: no Gatekeeper, no Plan
# Maker, no advisory traffic at all. The RL Orchestrator's recurrent PPO
# policy plays NASimEmu entirely on its own. This is the comparison point
# for the ASSISTED variant (see assisted.yaml) -- both variants share the
# same graph encoder / GRU / candidate-action scorer / critic / PPO
# hyperparameters / scenario / seed / step budget, so any difference in
# outcome is attributable to the query gate + Plan Maker, not to some other
# incidental config difference.
#
# Full field-by-field reference: docs/configuration.rst (or
# https://<your-rtd-project>.readthedocs.io/ once published). This file's
# comments focus on *why* each value was chosen for this specific example,
# not a repeat of the general schema reference.
#
# Run it:
#   export MARLA_RL_ORCHESTRATOR_PASSWORD=changeme
#   marla run examples/baseline.yaml
#   marla summarize runs/ppo_baseline/ppo-baseline-seed-42

schema_version: "1.0"  # only supported value

experiment:
  name: ppo_baseline
  # Unique per run; distinguishes repeated runs of the same experiment
  # (different seeds, different code versions, ...) under the same
  # runs/ppo_baseline/ directory. Optional for local mode (falls back to
  # `name`), but set explicitly here so results from different seeds don't
  # collide.
  run_id: ppo-baseline-seed-42
  # training (default) | evaluation. `evaluation` is reserved for a future
  # evaluation-only run mode (load a checkpoint, no gradient updates) --
  # not consumed by the runtime yet, so leave this at `training`.
  phase: training
  seed: 42

execution:
  # local | distributed. `local` runs every configured agent (here, just
  # the RL Orchestrator -- baseline has no other agents) in one process
  # over SPADE's embedded XMPP server: zero external setup. Switch to
  # `distributed` only once you actually need agents on separate
  # machines/processes -- see docs/architecture.rst's distributed-mode
  # section, and note it then requires `experiment.run_id` (already set
  # above) and a real, externally reachable XMPP server in `xmpp.server`
  # below instead of `localhost`.
  mode: local

# cpu | gpu | auto. `auto` uses CUDA if it initializes successfully, else
# CPU -- safe to leave as `auto` for the baseline variant (unlike the
# Plan Maker's device, a failed GPU init here just means slower training,
# not a broken run). Use `cpu` to force reproducible CPU-only runs, or
# `gpu` to *require* CUDA and fail fast if it isn't actually usable.
device: auto

xmpp:
  # `localhost` is correct for local mode's embedded XMPP server. For
  # distributed mode, point this at a real, externally reachable server
  # (Prosody, ejabberd, ...) instead.
  server: localhost

environment:
  mode: simulation  # only supported value
  # A NASimEmu scenario. A value ending in `.yaml` is a path to a static
  # scenario file (resolved relative to this config file's directory, as
  # here); any other string is the name of a procedurally generated
  # NASimEmu benchmark, resolved at runtime instead.
  scenario: ../NASimEmu/scenarios/sm_entry_dmz_one_subnet.v2.yaml
  # Episode truncation limit. NASimEmu itself never internally ends an
  # episode on a non-FINISH action (there is no environment step_limit
  # configured -- MARLA enforces this itself), so this is the only thing
  # bounding an episode where the agent never chooses FINISH.
  max_episode_steps: 100

objective:
  type: capture_target  # only supported value: all sensitive/value hosts compromised
  description: Obtain the configured target access
  # completion_reward (default 1.0) / premature_finish_penalty (default
  # -1.0) are left at their defaults here -- not shown below, but
  # overridable if you want a different reward shape for FINISH.

policy:
  algorithm: recurrent_ppo  # only supported value
  graph_encoder:
    type: graphsage  # only supported value
    hidden_size: 128  # GraphSAGE layer width
    layers: 2         # number of stacked SAGEConv layers
  action_encoder:
    hidden_size: 128               # per-action embedding width
    action_type_embedding_size: 32  # width of the learned action-type embedding
  recurrent:
    hidden_size: 128    # GRU hidden state width
    sequence_length: 32  # max steps per truncated-BPTT chunk during PPO replay;
                          # a chunk never spans an episode boundary regardless
  ppo:
    # Production-realistic scale (see experiment_templates/baseline.yaml,
    # generated by `marla init`, for a much smaller quickstart-sized
    # version of the same shape). Number of rollouts run is
    # ceil(total_environment_steps / rollout_steps) = ceil(100000/512) = 196.
    total_environment_steps: 100000
    rollout_steps: 512        # environment steps collected per rollout/PPO-update cycle
    epochs: 4                 # PPO passes over each collected rollout
    minibatch_sequences: 8    # sequence chunks per gradient step
    gamma: 0.99                # discount factor, 0 < gamma <= 1
    gae_lambda: 0.95            # GAE lambda, 0 <= lambda <= 1
    clip_epsilon: 0.2           # PPO clipping range, > 0
    value_coefficient: 0.5      # value-loss weight in the total loss, >= 0
    # Query-gate entropy bonus: harmless (and ignored -- there's no query
    # gate at all) for a baseline run. Kept identical to assisted.yaml for
    # a clean apples-to-apples comparison of the shared hyperparameters.
    query_entropy_coefficient: 0.01
    action_entropy_coefficient: 0.01  # action-distribution entropy bonus weight, >= 0
    max_grad_norm: 0.5                 # gradient clipping norm, > 0
    learning_rate: 0.0003               # Adam learning rate; constant for the
                                         # whole run, no scheduler in this release

consultation:
  # disabled: no Gatekeeper, no Plan Maker may be configured below (both
  # `gatekeeper` and `agents` must be absent/empty when this is disabled --
  # enforced by config validation). Set to `learned` to switch to the
  # assisted variant; see assisted.yaml for that shape.
  mode: disabled

rl_orchestrator:
  alias: rl_orchestrator  # short name, unique across all configured agents
  jid: rl-orchestrator@localhost  # full XMPP JID, unique across all configured agents
  # Name of an environment variable holding the XMPP password -- never the
  # password itself. `marla run` reads this at startup and fails fast if
  # the named variable isn't set.
  password_env: MARLA_RL_ORCHESTRATOR_PASSWORD

# No `gatekeeper:` and no `agents:` here -- both are forbidden while
# consultation.mode: disabled (config validation rejects them if present).

metrics:
  output_directory: runs  # where run directories are written (default)
  record_decisions: true   # write decisions.csv (one row per environment
                            # step); disable for a very long run where
                            # per-step granularity isn't needed
  # Periodic deterministic (greedy) evaluation episodes between rollouts --
  # gives `marla summarize` a real train-vs-eval reward/episode-length
  # curve (see docs/metrics.rst). Cheap here since baseline has no Plan
  # Maker to consult; enabled in this production example, unlike
  # assisted.yaml, where the equivalent setting is deliberately left at 0.
  eval_episodes: 3
  eval_every_rollouts: 5  # run the eval pass every 5th rollout, not every one

reproducibility:
  # Reserved for wiring up torch.use_deterministic_algorithms and related
  # settings; true is the only meaningfully different value today.
  deterministic_torch: true
