# research/aamas2027 -- MARLA_FULL condition, training seed 101.
#
# Every PPO/architecture hyperparameter and every Plan Maker setting below
# is copied verbatim from examples/assisted.yaml. Deltas from that file:
#   - environment.scenario: sm_entry_dmz_two_subnets.v2.yaml (absolute
#     path), not sm_entry_dmz_one_subnet.v2.yaml -- see
#     ppo_only_seed101.yaml's comment / AUDIT.md section 7.1.
#   - ppo.total_environment_steps: 5000 -- Stage A of a staged-training
#     design (manifest.yaml v4): a real pilot measurement (VALIDATION.md)
#     found MARLA_FULL would need ~13-14 days at a 50000-step budget at the
#     observed ~73s mean Plan Maker latency / ~32% pre-training query
#     rate, so training now proceeds in stages instead: 5000 steps first,
#     STOP and report, extend to 10000 via `marla run --resume` only if
#     both methods still look clearly undertrained and only with explicit
#     approval -- never restarting from scratch (checkpoint resume is
#     implemented and tested, see tests/test_checkpoint_resume.py).
#   - experiment.seed / run_id: this file's seed -- the SAME seed as
#     ppo_only_seed101.yaml, by design (Phase 2: paired training seeds
#     across primary trainable conditions).
#   - metrics.eval_episodes/eval_every_rollouts: turned ON here (0 in
#     assisted.yaml) so a real train-vs-eval learning curve exists for this
#     condition too -- accepting the extra Plan Maker inference cost this
#     adds, unlike assisted.yaml's production default.
#
# consultation.cost stays at 0.10, matching Phase 3B's MARLA_FULL spec and
# assisted.yaml's own default.
#
# Run it (needs the local-lm extra and a real ~3GB model download on first
# use -- see examples/assisted.yaml's own comment):
#   pip install -e ".[local-lm]"
#   export MARLA_RL_ORCHESTRATOR_PASSWORD=changeme
#   export MARLA_GATEKEEPER_PASSWORD=changeme
#   export MARLA_PLAN_MAKER_1_PASSWORD=changeme
#   marla run research/aamas2027/configs/marla_full_seed101.yaml
#   marla summarize runs/aamas2027_marla_full/marla-full-seed-101

schema_version: "1.0"

experiment:
  name: aamas2027_marla_full
  run_id: marla-full-seed-101
  phase: training
  seed: 101

execution:
  mode: local

device: auto

xmpp:
  server: localhost

environment:
  mode: simulation
  scenario: /home/ubuntu/work/marla/NASimEmu/scenarios/sm_entry_dmz_two_subnets.v2.yaml
  max_episode_steps: 100

objective:
  type: capture_target
  description: Obtain the configured target access

policy:
  algorithm: recurrent_ppo
  graph_encoder:
    type: graphsage
    hidden_size: 128
    layers: 2
  action_encoder:
    hidden_size: 128
    action_type_embedding_size: 32
  recurrent:
    hidden_size: 128
    sequence_length: 32
  ppo:
    total_environment_steps: 5000  # ceil(5000/512) = 10 rollouts -- Stage A
    rollout_steps: 512
    epochs: 4
    minibatch_sequences: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    query_entropy_coefficient: 0.01
    action_entropy_coefficient: 0.01
    max_grad_norm: 0.5
    learning_rate: 0.0003

consultation:
  mode: learned
  cost: 0.10
  max_schema_revisions: 3

rl_orchestrator:
  alias: rl_orchestrator
  jid: rl-orchestrator@localhost
  password_env: MARLA_RL_ORCHESTRATOR_PASSWORD

gatekeeper:
  alias: gatekeeper
  jid: gatekeeper@localhost
  password_env: MARLA_GATEKEEPER_PASSWORD

agents:
  - alias: plan_maker_1
    jid: plan-maker@localhost
    password_env: MARLA_PLAN_MAKER_1_PASSWORD
    role: plan_maker
    model:
      backend: local
      name: Qwen/Qwen2.5-1.5B-Instruct
      max_new_tokens: 256
    prompt_version: nasimemu-plan-maker-v1
    knowledge:
      path: package://marla/knowledge/nasimemu_rules.yaml
      version: nasimemu-rules-v1

metrics:
  output_directory: runs
  record_decisions: true
  # Unlike PPO_ONLY, each periodic eval pass here uses the LEARNED query
  # gate normally (not forced) -- so it is not free: real Plan Maker calls
  # at real measured latency (VALIDATION.md: ~73s mean). Deliberately
  # sparse (2 points across this run's 10 rollouts, 2 episodes each) --
  # explicit instruction: "do not perform expensive periodic MARLA
  # evaluation every few rollouts". A worst-case bound: 2 points x 2
  # episodes x <=100 steps x query_rate x ~73s -- at the pilot's untrained
  # ~32% rate, roughly 2-3 hours added across the whole run, not per point.
  eval_episodes: 2
  eval_every_rollouts: 5

reproducibility:
  deterministic_torch: true
