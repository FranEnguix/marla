# research/aamas2027 -- PPO_ONLY condition, training seed 202.
#
# SCENARIO MIGRATION (see manifest.yaml's latest revision note and
# src/marla/scenarios/solvable/README.md): environment.scenario now points
# at MARLA's repaired, universally-solvable copy of this scenario
# (src/marla/scenarios/solvable/sm_entry_user_three_subnets.solvable.v2.yaml),
# not the original NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml.
# `marla scenario check` proves the original is NOT universally solvable
# (a sensitive Windows host can legally generate with only USER-level
# exploitable services and no compatible ROOT privilege escalation) --
# `marla run` would now refuse to start against it.
#
# IMPORTANT: the run this exact seed/run_id previously produced
# (runs/aamas2027_ppo_only/ppo-only-seed-202/) was executed under the OLD,
# unsolvable scenario, BEFORE this repair existed. That run is PILOT /
# INVALID FOR FINAL COMPARISON (unsolvable source scenario) -- its
# artifacts are preserved unmodified for provenance, but this config file
# now describes the scenario that a *future* run of this seed should use,
# not the one the existing run directory actually used. Do not treat the
# existing run_dir's data as if it came from the new scenario, and do not
# silently mix it with any future re-run's results in a "final" comparison.
#
# Every PPO/architecture hyperparameter below is copied verbatim from
# examples/baseline.yaml (Phase 2's "keep the production PPO architecture
# unless there is a demonstrated bug" instruction). The only deltas from
# that file are:
#   - environment.scenario: sm_entry_user_three_subnets.v2.yaml, not
#     sm_entry_dmz_one_subnet.v2.yaml -- see AUDIT.md section 7.1 (the
#     latter has a vacuous objective: 0.0 sensitive-host probability on
#     both its subnets, so the goal is already satisfied at step 0).
#   - ppo.total_environment_steps: 5000 -- Stage A of a staged-training
#     design (manifest.yaml v4): a real pilot measurement (VALIDATION.md)
#     found MARLA_FULL would need ~13-14 days at a 50000-step budget at the
#     observed ~73s mean Plan Maker latency / ~32% pre-training query
#     rate, so training now proceeds in stages instead: 5000 steps first,
#     STOP and report, extend to 10000 via `marla run --resume` only if
#     both methods still look clearly undertrained and only with explicit
#     approval -- never restarting from scratch (checkpoint resume is
#     implemented and tested, see tests/test_checkpoint_resume.py).
#   - experiment.seed / run_id: this file's seed.
#   - metrics.eval_episodes/eval_every_rollouts: tuned for ~10k-step
#     learning-curve points (see manifest.yaml's periodic_evaluation section)
#     rather than baseline.yaml's every-5-rollouts cadence.
#   - Uses an ABSOLUTE environment.scenario path deliberately: the
#     checkpoint-evaluation harness (src/marla/evaluation/checkpoint_eval.py)
#     reloads this file's saved copy (run_dir/config.yaml) from inside the
#     run directory, not from this configs/ directory -- a relative path
#     would resolve against the wrong base directory at that point.
#
# Run it:
#   export MARLA_RL_ORCHESTRATOR_PASSWORD=changeme
#   marla run research/aamas2027/configs/ppo_only_seed202.yaml
#   marla summarize runs/aamas2027_ppo_only/ppo-only-seed-202

schema_version: "1.0"

experiment:
  name: aamas2027_ppo_only
  run_id: ppo-only-seed-202
  phase: training
  seed: 202

execution:
  mode: local

device: auto

xmpp:
  server: localhost

environment:
  mode: simulation
  scenario: /home/ubuntu/work/marla/src/marla/scenarios/solvable/sm_entry_user_three_subnets.solvable.v2.yaml
  max_episode_steps: 100

objective:
  type: capture_target
  description: Obtain the configured target access

policy:
  algorithm: recurrent_ppo
  graph_encoder:
    type: graphsage
    hidden_size: 128
    layers: 2
  action_encoder:
    hidden_size: 128
    action_type_embedding_size: 32
  recurrent:
    hidden_size: 128
    sequence_length: 32
  ppo:
    total_environment_steps: 5000  # ceil(5000/512) = 10 rollouts -- Stage A
    rollout_steps: 512
    epochs: 4
    minibatch_sequences: 8
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    value_coefficient: 0.5
    query_entropy_coefficient: 0.01
    action_entropy_coefficient: 0.01
    max_grad_norm: 0.5
    learning_rate: 0.0003

consultation:
  mode: disabled

rl_orchestrator:
  alias: rl_orchestrator
  jid: rl-orchestrator@localhost
  password_env: MARLA_RL_ORCHESTRATOR_PASSWORD

metrics:
  output_directory: runs
  record_decisions: true
  # eval_every_rollouts=2 -> periodic points at rollout 2/4/6/8/10
  # (environment steps 1024/2048/3072/4096/5120) across this run's 10
  # rollouts, using the existing between-rollout callback's fixed
  # EVAL_SEED_OFFSET seed sequence (identical across every run in this
  # program -- see manifest.yaml). Cheap for PPO_ONLY (no Plan Maker); the
  # MARLA_FULL equivalent setting is a real cost driver, deliberately
  # sparser -- see marla_full_seed101.yaml's comment.
  eval_episodes: 3
  eval_every_rollouts: 2

reproducibility:
  deterministic_torch: true
