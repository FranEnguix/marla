# Machine-readable experiment manifest (Phase 2). Every aggregate figure/
# table in this program is produced by analyze.py joining a run's own
# episodes.csv/decisions.csv/updates.csv (untouched MARLA schema) against
# this file plus scenario_manifest.csv -- never by mutating MARLA's core
# per-run CSV schema with research-specific columns.
#
# REVISION HISTORY (kept, not overwritten, so every past decision stays
# traceable):
#   v7 (current) -- primary_training_scenario switched to MARLA's own
#         repaired, universally-solvable copy of the scenario
#         (src/marla/scenarios/solvable/sm_entry_user_three_subnets.solvable.v2.yaml,
#         see that directory's README.md for the exact repair). `marla
#         scenario check` proved the v5/v6 scenario
#         (NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml) is NOT
#         universally solvable: a sensitive Windows host can legally
#         generate with only USER-level exploitable services (e_wp_ninja)
#         and no compatible ROOT privilege escalation -- confirmed both
#         symbolically (exhaustive worst-case proof, not sampling) and
#         empirically (2206/6744 sampled windows-sensitive hosts across
#         3000 seeds hit exactly this class). This means every PPO_ONLY
#         run under conditions.PPO_ONLY.runs below (seeds 101/202/303,
#         "v6") was trained and evaluated against a scenario that could
#         not always be won even in principle -- **those three runs are
#         PILOT / INVALID FOR FINAL COMPARISON / UNSOLVABLE SOURCE
#         SCENARIO** (see the per-seed ``status`` field added below). Their
#         artifacts under runs/aamas2027_ppo_only/ are preserved unmodified
#         (never rewritten to pretend they used the repaired scenario) --
#         they remain useful evidence of the 0%-success/FINISH-collapse
#         investigation that led to this repair, just not comparable to
#         any future run. All 6 configs/*.yaml now point at the repaired
#         scenario for the NEXT execution of each seed; MARLA_FULL has
#         still never been executed under any scenario, so its configs
#         needed no provenance annotation, only the scenario-field update.
#         No PPO/consultation hyperparameter was changed as part of this
#         revision. Final AAMAS experiments are NOT launched by this
#         revision -- re-running PPO_ONLY (and then MARLA_FULL) under the
#         repaired scenario, and separately re-validating PPO
#         learnability (a different question from structural solvability;
#         see docs/scenario_solvability.rst), remain future work.
#   v1 -- 50k-step primary training, full ablation set including
#         ALWAYS_QUERY/PLAN_MAKER_ONLY/BETA_ZERO/BETA_ONE.
#   v2 -- reduced primary training to 5k steps after a first smoke test
#         measured ~92s/consultation; still too expensive to complete as a
#         "smoke test" (killed partway, see pilot_measurements).
#   v3 -- primary training restored to 50k steps; required suite cut to
#         PPO_ONLY/MARLA_FULL/MARLA_FULL_NO_QUERY.
#   v4 -- staged training: 5,000-step Stage A now (the real
#         target, not a placeholder), STOP and report, extend to 10,000 via
#         `marla run --resume` only with explicit approval -- 50k is off
#         the table entirely for this paper's timeline. Checkpoint resume
#         (policy/optimizer/RNG-state/episode-seed continuation) is now
#         implemented and tested (tests/test_checkpoint_resume.py). Plan
#         Maker profiling (plan_maker_profiling below) found no fixable
#         latency bottleneck -- the ~73s mean is a genuine cost of the
#         current model/design, not a bug.
#   v6 (current) -- PPO_ONLY Stage A actually run for all 3 seeds (101,
#         202, 303) under the v5 scenario/config, real final ID evaluation
#         run against the manifest's own fixed eval seeds (5001, 5 episodes/
#         seed), and a PPO_ONLY-specific aggregate/figure set generated
#         (research/aamas2027/scripts/ppo_only_report.py,
#         aggregate/ppo_only_seed_summary.csv,
#         tables/ppo_only_seed_summary.md, figures/ppo_only_*). MARLA_FULL
#         was NOT run in this revision (out of scope for the task that
#         produced it). Two implementation bugs in the analysis tooling were
#         found and fixed as part of validating these results (see git
#         history around this revision): evaluate_checkpoint.py called
#         marla.metrics.writer._decision_row with a stale signature, and
#         analyze.py's query_rate_over_training/beta_over_training read
#         updates.csv columns that had moved to rollouts.csv -- both would
#         have silently produced broken/empty output for MARLA_FULL's
#         eventual evaluation and analysis too. See the PPO_ONLY conditions
#         block's own note below for the actual (concerning) results.
#   v5 -- primary/ID training scenario switched to
#         sm_entry_user_three_subnets.v2.yaml, matching a repo-wide default
#         scenario change (examples/, config/templates.py, CLI). It was
#         previously this program's OOD "entry/topology shift" scenario
#         (v1-v4); the former ID scenario, sm_entry_dmz_two_subnets.v2.yaml,
#         is demoted to OOD in its place (still a genuine entry/topology
#         shift relative to the new ID) and
#         md_entry_user_three_subnets.v2.yaml -- a larger scenario sharing
#         the new ID's user-subnet entry point -- takes over as the
#         "harder, same-entry-type" OOD slot, replacing
#         sm_entry_dmz_three_subnets.v2.yaml. All 6 configs/ files' own
#         environment.scenario are updated; the v1-v4 pilot/interim results
#         and Plan Maker profiling above were measured against the OLD ID
#         scenario and are STALE for any scenario-dependent conclusion
#         (goal success rate, steps-to-goal, episode length) -- Plan Maker
#         latency/token-count numbers remain valid (model/hardware-driven,
#         not scenario-driven). The pilot has not been re-run since this
#         change; see QUICKSTART.md/AUDIT.md, which still describe the old
#         scenario pairing and need a matching update before being trusted
#         again. This reclassification was made to satisfy an explicit
#         instruction to adopt the new scenario "including all the aamas
#         experiments"; the specific OOD replacement choices above were not
#         independently re-verified for loadability/steppability against a
#         policy trained on the new ID scenario the way the v1 pairing
#         originally was (AUDIT.md 7.1) -- do that before relying on any
#         OOD figure produced under this manifest revision.

schema_version: 1
git_sha: a82df30c4f2c8737b3f78f6f66c8d3d6ed63ca3f  # the v4-revision commit; v5-v7 only edit this manifest + configs/, not marla's own training code
# v7: MARLA-owned, universally-solvable repaired copy -- see the v7 note
# above and src/marla/scenarios/solvable/README.md. The original,
# NOT-universally-solvable NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml
# is deliberately left unmodified as provenance (see AUDIT.md / `marla
# scenario check NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml`).
primary_training_scenario: src/marla/scenarios/solvable/sm_entry_user_three_subnets.solvable.v2.yaml
scenario_manifest: scenario_manifest.csv

# Fixed BEFORE any run exists; not selected based on results (Phase 2).
# "Prefer adding seeds 404/505 over increasing environment-step budget" if
# 5,000 steps already gives a stable signal (explicit instruction) --
# those two are NOT added yet, only listed here as the agreed next move.
training_seeds: [101, 202, 303]
reserve_training_seeds_if_5k_is_stable: [404, 505]

staged_training:
  stage_a: {target_environment_steps: 5000, status: "not yet launched -- awaiting confirmation after this report"}
  stage_b: {target_environment_steps: 10000, status: "requires explicit approval AFTER stage_a's interim report, and only if both methods still look clearly undertrained", how: "marla run --resume <stage_a checkpoint.pt> <stage_b config with total_environment_steps: 10000>"}
  resume_mechanism: "src/marla/learning/checkpoint.py (next_episode_seed, rng_state fields) + cli.py's --resume flag + learning/trainer.py's initial_environment_steps/initial_update_count -- confirmed working end to end via a real two-process marla run / marla run --resume pair (tests/test_checkpoint_resume.py::test_resume_continues_rather_than_restarts): policy/optimizer state, environment_steps/update numbering, and episode-seed progression all continue correctly rather than restarting."

# Real measurements from the v2 pilot (MARLA_FULL seed 101, killed partway
# through rollout 1/10 of a 5000-step run once enough data had accumulated
# -- not a completed run, a deliberately-interrupted measurement pass).
pilot_measurements:
  source_run: runs/aamas2027_marla_full/marla-full-seed-101  # NOTE: this checkpoint is NOT a valid trained result -- interrupted at ~151/5000 steps; will be overwritten by the real Stage A run
  environment_steps_observed: 151
  wall_clock_seconds_observed: 3538
  consultations_completed: 48
  consultation_latency_seconds: {mean: 73.3, p50: 91.5, p95: 108.7, min: 7.7, max: 109.2}
  query_rate_observed: 0.318  # 48/151 -- an UNTRAINED gate
  extrapolated_50000_step_marla_full_runtime_hours: {estimate: 325, note: "off the table entirely as of v4 -- superseded by staged_training above"}
  extrapolated_5000_step_marla_full_runtime_hours: {estimate: 32.5, basis: "5000/151 * 3538s -- Stage A's own real target, still substantial (dominated by Plan Maker latency), see the final summary for the launch decision"}

# Profiling BEFORE any long run (this revision's explicit requirement) --
# see research/aamas2027/scripts/profile_plan_maker.py and its two real
# runs (baseline, then a JSON-completion-aware early-stopping A/B test).
plan_maker_profiling:
  device: cuda  # torch.cuda.is_available()=True, model resolved to cuda -- no CPU fallback
  dtype: bfloat16
  model_loaded_once: true  # single LocalTransformersBackend instance, constructed once, reused for every consultation in a run -- verified by code inspection, not just assumption
  use_cache: "model.generation_config.use_cache is None (library default = enabled); empirically consistent -- tokens/sec degrades mildly (25.7 -> 19.4 -> 15.4 across 203/1139/1513 output tokens), not the severe quadratic collapse a disabled KV cache would produce"
  representative_consultations:
    - {legal_action_count: 11, prompt_tokens: 1184, configured_max_new_tokens: 342, actual_output_tokens: 203, hit_token_cap: false, latency_s: 7.9, tokens_per_second: 25.7}
    - {legal_action_count: 61, prompt_tokens: 3835, configured_max_new_tokens: 1819, actual_output_tokens: 1139, hit_token_cap: false, latency_s: 58.7, tokens_per_second: 19.4}
    - {legal_action_count: 81, prompt_tokens: 4875, configured_max_new_tokens: 2410, actual_output_tokens: 1513, hit_token_cap: false, latency_s: 98.0, tokens_per_second: 15.4}
  hit_token_cap_finding: "FALSE in every representative case -- the model stops via its own EOS well before max_new_tokens (e.g. 1513/2410 = 63% of budget for the largest case), so it is not 'rambling to the cap'."
  early_stop_ab_test: "A JSON-completion-aware StoppingCriteria (stops the instant a complete, balanced top-level JSON object exists -- reusing response_parser._find_first_balanced_object_span, guaranteeing identical parsed output whenever both variants complete) was implemented and tested against the same 3 representative prompts. Result: +2.7%, -0.7%, -5.6% latency change -- noise, not a real improvement (in the largest case the model's own natural stop landed at token 1512 of 1513 actually generated, i.e. one token later than the earliest possible detection)."
  gatekeeper_correction_count: "not separately measured in this profiling pass -- all 3 representative prompts were accepted on the first attempt (schema_revision_count=0); the pilot's 48 real consultations were likewise all 'accepted' per the training log, no correction retries observed"
  verdict: "NO fixable performance bottleneck found (no CPU fallback, no repeated model loading, cache appears active, model already stops near-optimally via EOS, corrections are not occurring in practice). The ~73s mean latency is a genuine cost of Qwen2.5-1.5B-Instruct generating ~200-1500 tokens per consultation on a T4, not a bug. Per instruction, Qwen2.5-0.5B was NOT tried (previously found unable to reliably produce valid JSON). No production code was changed as a result of this investigation -- local_backend.py is unmodified."

# Disjoint from training_seeds and from each other. Reduced again in v4
# (was 15/8/8 in v3) per explicit instruction not to use those counts yet.
evaluation_seed_sets:
  final_id:
    start: 5001
    count: 5
    scenario: NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml
    id_or_ood: ID
  final_ood_dmz_three_subnets:
    start: 6001
    count: 3
    # v5: harder-variant OOD slot, now filled by the larger scenario
    # sharing the new ID's user-subnet entry point (see manifest revision
    # history above) -- key kept as "dmz_three_subnets" for continuity
    # with earlier aggregate/ output; the scenario it points at changed.
    scenario: NASimEmu/scenarios/md_entry_user_three_subnets.v2.yaml
    id_or_ood: OOD
  final_ood_user_three_subnets:
    start: 6001  # same numeric seeds reused across OOD scenarios on purpose
    count: 3
    # v5: entry/topology-shift OOD slot, now filled by the former ID
    # scenario (see manifest revision history above) -- key kept as
    # "user_three_subnets" for continuity; the scenario it points at changed.
    scenario: NASimEmu/scenarios/sm_entry_dmz_two_subnets.v2.yaml
    id_or_ood: OOD
  periodic_learning_curve:
    start: 1000000000  # EVAL_SEED_OFFSET, a source constant -- identical across every run by construction
    count: 3
    scenario: NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml
    id_or_ood: ID
    note: >
      PPO_ONLY: eval_every_rollouts=2, eval_episodes=3 (free, 5 points
      across Stage A's 10 rollouts). MARLA_FULL: eval_every_rollouts=5,
      eval_episodes=2 (deliberately sparse -- 2 points only, per explicit
      instruction not to run expensive periodic MARLA evaluation every few
      rollouts). Report the actual query rate observed after Stage A
      before deciding whether to expand this.

plan_maker:
  model_name: Qwen/Qwen2.5-1.5B-Instruct  # kept -- Qwen2.5-0.5B previously found unable to reliably produce valid JSON, not retried
  model_revision: "not pinned by MARLA -- AutoModelForCausalLM.from_pretrained is called with no revision= argument; model_name is the only identity MARLA itself records"
  prompt_version: nasimemu-plan-maker-v1
  knowledge_version: nasimemu-rules-v1
  max_schema_revisions: 3
  generation: "greedy (do_sample=False), no explicit LM RNG seed; use_cache library-default-enabled (see plan_maker_profiling)"

conditions:
  PPO_ONLY:
    trainable: true
    consultation_mode: disabled
    query_mode: n/a
    trust_mode: n/a
    advice_transformation: n/a
    training_step_budget: 5000  # Stage A -- see staged_training
    runs:
      101: {config: configs/ppo_only_seed101.yaml, run_dir: runs/aamas2027_ppo_only/ppo-only-seed-101, status: PILOT_INVALID_UNSOLVABLE_SCENARIO}
      202: {config: configs/ppo_only_seed202.yaml, run_dir: runs/aamas2027_ppo_only/ppo-only-seed-202, status: PILOT_INVALID_UNSOLVABLE_SCENARIO}
      303: {config: configs/ppo_only_seed303.yaml, run_dir: runs/aamas2027_ppo_only/ppo-only-seed-303, status: PILOT_INVALID_UNSOLVABLE_SCENARIO}
    note: "v6 (run) / v7 (reclassified): all 3 seeds (101, 202, 303) COMPLETED under the v5/v6 scenario -- 5120 real environment steps each (ceil(5000/512)*512), config_hash-verified to match this file's own configs/*.yaml at the time, all incremental-metrics CSVs parse with monotonic global_environment_step and single headers (see research/aamas2027/aggregate/ppo_only_seed_summary.csv). PILOT / INVALID FOR FINAL COMPARISON / UNSOLVABLE SOURCE SCENARIO (v7): `marla scenario check` proved NASimEmu/scenarios/sm_entry_user_three_subnets.v2.yaml -- the scenario these 3 runs actually used -- is not universally solvable, so these results must not be presented as, or silently mixed into, a final scientific comparison; any analysis script that auto-discovers run directories under runs/aamas2027_ppo_only/ must check this manifest's per-run `status` field (any value other than absent/OK excludes it from a final-comparison figure/table) rather than assuming every discovered run is comparable. IMPORTANT CAVEAT, preserved from v6 (see aggregate/ppo_only_seed_summary.csv and figures/ppo_only_finish_behavior.*): 0% goal success on all 3 seeds (expected for Stage A's short budget), and 2 of 3 seeds (101, 202) show the base policy's argmax collapsing onto FINISH by the final rollouts of training, with final deterministic evaluation selecting FINISH as the very first action in 5/5 episodes for both -- the third seed (303) shows the opposite degenerate behavior (never selects FINISH, all 5 eval episodes time out). This is evidence Stage A is not just quantitatively undertrained but may be converging toward degenerate solutions -- and, per the FINISH-collapse investigation this led to (research/aamas2027/investigation/), a separate, now-fixed problem from the unsolvable-scenario finding above. Do not treat these PPO_ONLY numbers as paper-ready under any circumstance -- they must be re-run against the repaired scenario before any final comparison."

  MARLA_FULL:
    trainable: true
    consultation_mode: learned
    consultation_cost: 0.10
    query_mode: learned  # the gate's own decision; NEVER forced during training
    trust_mode: learned
    advice_transformation: identity
    training_step_budget: 5000  # Stage A -- see staged_training
    runs:
      101: {config: configs/marla_full_seed101.yaml, run_dir: runs/aamas2027_marla_full/marla-full-seed-101}
      202: {config: configs/marla_full_seed202.yaml, run_dir: runs/aamas2027_marla_full/marla-full-seed-202}
      303: {config: configs/marla_full_seed303.yaml, run_dir: runs/aamas2027_marla_full/marla-full-seed-303}
    note: "seed 101's run_dir currently holds only the interrupted pilot measurement pass (151/5000 steps) -- NOT a trained checkpoint, must be re-run to completion"

  MARLA_FULL_NORMAL:
    trainable: false
    evaluation_only: true
    base_condition: MARLA_FULL
    overrides: {query_mode: learned, beta_override: null, action_selection: policy}
    description: The trained checkpoint's learned behavior, re-run deterministically -- uses the learned query gate normally, no forced extra queries.

  MARLA_FULL_NO_QUERY:
    trainable: false
    evaluation_only: true
    base_condition: MARLA_FULL
    overrides: {query_mode: never, beta_override: null, action_selection: policy}
    description: "The main required inference ablation (RQ2): force q=0 for the whole episode (zero Plan Maker calls), otherwise the trained PPO policy unchanged. Free regardless of Plan Maker cost."

research_questions:
  RQ1: "Does MARLA_FULL outperform PPO_ONLY at the same environment-step budget? Metrics: goal_success, benchmark_return, steps_to_goal. Source: aggregate/learning_curve_bands.csv (Figure 1), aggregate/id_and_ood_eval.csv restricted to condition in {PPO_ONLY, MARLA_FULL_NORMAL} (Figure 2)."
  RQ2: "How much does a trained MARLA agent depend on consultation? Compare MARLA_FULL_NORMAL vs MARLA_FULL_NO_QUERY on the SAME checkpoints -- an evaluation-time ablation, never described as an independently trained baseline. Source: aggregate/id_and_ood_eval.csv."
  RQ3: "When and how does MARLA consult? Offline analysis of already-collected decisions.csv only -- no new Plan Maker calls. Source: aggregate/consultation_behavior.csv, query_rate_over_training.csv, beta_over_training.csv, advice_trust_decisions.csv, consultations_per_successful_episode.csv, beta_stratified_advice_influence.csv (Figures 3-4)."
  RQ4: "Does MARLA generalize better than PPO_ONLY? Compare final PPO_ONLY and MARLA_FULL_NORMAL checkpoints on the 2 OOD scenarios, no gradient updates. Source: aggregate/id_and_ood_eval.csv restricted to scenario != ID (part of Figure 2)."

postponed_pending_feasibility:
  # Implemented in src/marla/evaluation already -- NOT launched.
  - condition: MARLA_FULL_ALWAYS_QUERY
    reason: "Forces a Plan Maker call on every environment step -- infeasible at measured latency for any non-trivial episode count."
  - condition: PLAN_MAKER_ONLY
    reason: "Same as ALWAYS_QUERY (query_mode=always by construction)."
  - condition: ALWAYS_CONSULT (trained)
    reason: "Would train under query_mode=always for the entire step budget -- infeasible by the same argument."
  - condition: MARLA_FULL_BETA_ZERO / MARLA_FULL_BETA_ONE
    reason: "Does not itself force extra queries, but descoped for this phase to keep the required comparison set to exactly PPO_ONLY/MARLA_FULL/MARLA_FULL_NO_QUERY. decisions.csv does not persist raw per-action logit/advice vectors, so an exact beta=0/1 forced counterfactual isn't reconstructable from existing data anyway -- analyze.py's beta_stratified_advice_influence() produces the honest, weaker, zero-new-call alternative: advice-influence rate stratified by the beta value that actually occurred, explicitly labeled observational."

postponed:
  - RANDOM_QUERY_MATCHED
  - ENTROPY_QUERY_MATCHED
  - SHUFFLED_ADVICE
  - REVERSED_ADVICE
  - consultation_cost_sweep (0.00 / 0.05 / 0.20)
  - external_nasimemu_agents_baseline
  - simulation_to_emulation
  - training_seeds_5_to_10 (404/505 reserved, see reserve_training_seeds_if_5k_is_stable)
  - 100k_and_50k_and_20k_step_runs
